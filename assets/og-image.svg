<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c2e"/>
      <stop offset="0.55" stop-color="#12121c"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="120" r="260" fill="url(#glow)"/>

  <!-- Left: text block -->
  <g font-family="-apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="205" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-2">DON'T</text>
    <text x="80" y="315" font-size="96" font-weight="900" fill="url(#accent)" letter-spacing="-2">TAP THAT</text>
    <text x="82" y="385" font-size="34" font-weight="600" fill="#9a9ab0">Obey the command. Or don't.</text>

    <!-- CTA pill -->
    <rect x="82" y="440" rx="30" ry="30" width="360" height="66" fill="url(#accent)"/>
    <text x="262" y="484" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">TAP TO PLAY</text>

    <text x="84" y="560" font-size="24" font-weight="500" fill="#6b6b82">A reflex game that learns how to make you fail.</text>
  </g>

  <!-- Right: the "no-tap" mark -->
  <g transform="translate(915, 315)">
    <circle cx="0" cy="0" r="150" fill="url(#disc)"/>
    <text x="0" y="26" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#1b1b2a" text-anchor="middle">TAP</text>
    <line x1="-150" y1="150" x2="150" y2="-150" stroke="#ff3b46" stroke-width="46" stroke-linecap="round"/>
  </g>
</svg>
